[project]
name = "forger"
version = "0.1.0"
description = "AI-powered bug-fixing pipeline orchestrator"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [{name = "Przemyslaw Kukulski", email = "przemyslaw.kukulski@gmail.com"}]
keywords = ["ai", "bug-fixing", "automation", "sentry", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/DimmuR/forger"
Documentation = "https://github.com/DimmuR/forger/tree/master/docs"
"Bug Tracker" = "https://github.com/DimmuR/forger/issues"
Changelog = "https://github.com/DimmuR/forger/blob/master/CHANGELOG.md"

[project.scripts]
forger = "forger.cli:app"
forger-tui = "forger.tui.app:run"

[project.optional-dependencies]
tui = ["textual>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-tmp-files>=0.0.2",
    "pyright>=1.1",
    "ruff>=0.5",
    "textual>=1.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
exclude = [".claude/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "RUF", "B"]
ignore = [
    "B008",     # typer.Option() in function defaults is the standard Typer pattern
    "E501",     # line length handled by formatter
    "SIM115",   # context manager for open — not always practical with conditional file handles
]

[tool.pyright]
pythonPlatform = "Linux"
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests"]
venvPath = "."
venv = ".venv"
